apiVersion: v1
kind: ConfigMap
metadata:
  name: pagina-api
data:
  index.html: |
    <h1>sagui</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      componente: api
  template:
    metadata:
      labels:
        componente: api
        versao: v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 3
          volumeMounts:
            - name: pagina
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: pagina
          configMap:
            name: pagina-api
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    componente: backend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliente
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cliente
  template:
    metadata:
      labels:
        app: cliente
    spec:
      containers:
        - name: cliente
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
