apiVersion: v1
kind: ConfigMap
metadata:
  name: pagina
data:
  index.html: |
    <h1>aplicação pronta</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          readinessProbe:
            httpGet:
              path: /pronto
              port: 80
            periodSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: pagina
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: pagina
          configMap:
            name: pagina
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliente
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cliente
  template:
    metadata:
      labels:
        app: cliente
    spec:
      containers:
        - name: cliente
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
