apiVersion: v1
kind: ConfigMap
metadata:
  name: pagina
data:
  index.html: |
    <h1>ambiente kubernetes</h1>
---
apiVersion: v1
kind: Secret
metadata:
  name: credencial
type: Opaque
stringData:
  token: tamandua
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          env:
            - name: LAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: credencial
                  key: token
          volumeMounts:
            - name: pagina
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: pagina
          configMap:
            name: pagina

